name: check
on:
  workflow_dispatch:
  schedule:
    # UTC (PST + 8). GitHub may start scheduled runs 5-30 min late.
    - cron: "0 4 18,19,20 11 *"   # KEY  Tue/Wed/Thu 8:00 pm PST
    - cron: "0 4 21 11 *"         # KEY  Fri 8:00 pm PST
    - cron: "30 14 21 11 *"       # KEY  Sat 6:30 am PST
    - cron: "0 18 21 11 *"        # KEY  Sat 10:00 am PST
    - cron: "30 20 21 11 *"       # KEY  Sat 12:30 pm PST
    - cron: "15,45 20-23 20 11 *" # monitor Fri 12:15-3:45 pm PST
    - cron: "15,45 * 21 11 *"     # monitor Fri 4:15 pm - Sat 3:45 pm PST
    - cron: "15,45 0-7 22 11 *"   # monitor Sat 4:15 - 11:45 pm PST
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Scenario tests (a failure stops the deploy; the last good page stays up)
        run: python3 -m unittest -v test_planner
      - name: Run checks
        env:
          TZ: America/Los_Angeles
          PAGE_URL: ${{ vars.PAGE_URL }}
          CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          D=site/${{ vars.PAGE_PATH }}
          mkdir -p $D
          echo '<!doctype html><title>.</title>' > site/index.html
          python3 run.py $D
          cp control.html $D/index.html
          cp -R floorplan site/eb534028577e42caaab0
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Push to phone
        if: always() && hashFiles('notify.json') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, time, autocheck
          n = json.load(open("notify.json"))
          autocheck.notify(os.environ["NTFY_TOPIC"], n["plan"], n["body"], os.environ["PAGE_URL"] + "?t=" + str(int(time.time())), n.get("title"))
          PY
